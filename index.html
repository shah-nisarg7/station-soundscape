<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Soundscape</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Station Soundscape</h1>
    <p class="tagline">Generative music from live train data</p>
  </header>

  <main class="app-main">
    <canvas id="viz" width="800" height="450"></canvas>
        <section class="controls">
      <button id="start-button" type="button">Start sound</button>
      <label class="volume-label">
        Volume
        <input id="volume-slider" type="range" min="0" max="100" value="50" />
      </label>
    </section>
    <p id="status" class="status">Ready</p>
  </main>

  <footer class="app-footer">
    <small>Built with open train data</small>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
