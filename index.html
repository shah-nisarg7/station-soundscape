<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Soundscape</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Station Soundscape</h1>
    <p class="tagline">Generative music from live train data</p>
  </header>

  <main class="app-main">
    <canvas id="viz" width="800" height="450"></canvas>
        <section class="controls">
      <button id="start-button" type="button">Start sound</button>
      <label class="volume-label">
              <label class="control-label">
        Station
        <select id="station-select">
          <option value="HKI">Helsinki (HKI)</option>
          <option value="TPE">Tampere (TPE)</option>
          <option value="TKU">Turku (TKU)</option>
          <option value="OUL">Oulu (OUL)</option>
          <option value="RI">Riihimäki (RI)</option>//i took the names from the website
        </select>
      </label>
      <label class="control-label">
        Mood
        <select id="scale-select">
          <option value="majorPentatonic">Bright (major)</option>
          <option value="minorPentatonic">Sad (minor)</option>
        </select>
      </label>
        Volume
        <input id="volume-slider" type="range" min="0" max="100" value="50" />
      </label>
    </section>
    <p id="status" class="status">Ready</p>
        <p id="now-playing" class="status"></p>
  </main>

  <footer class="app-footer">
    <small>Built with open train data</small>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
